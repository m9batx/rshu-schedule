{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}

<div class="card green" style="max-width: 420px; margin: 60px auto;">
    <h2>🔐 Admin Login</h2>
    <form method="post" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required autofocus maxlength="128">
        <br><br>
        <button type="submit" class="btn green" style="width: 100%;">Sign in</button>
    </form>
</div>

{% endblock %}
