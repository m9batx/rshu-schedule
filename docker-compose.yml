services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      # Set these in a .env file next to this compose file (never commit it):
      #   ADMIN_USER=...
      #   ADMIN_PASSWORD_HASH=...
      #   SECRET_KEY=...
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DATA_DIR: /app/data
    volumes:
      # Named volume keeps the DB + uploads across restarts/redeploys.
      # (or bind-mount a host folder:  - ./data:/app/data)
      - appdata:/app/data
    restart: unless-stopped

volumes:
  appdata:
